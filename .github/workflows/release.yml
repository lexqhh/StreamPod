name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Version du tag identique aux 3 fichiers
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$v\"" package.json
          grep -q "\"version\": \"$v\"" src-tauri/tauri.conf.json
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Compilation
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npm run tauri build

      - name: Binaires, latest.json et notes de release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # Seuls les fichiers utiles sont publiés : les signatures vivent dans
          # latest.json, les empreintes dans les notes.
          mkdir dist-release signatures
          cp src-tauri/target/release/streampod.exe dist-release/StreamPod.exe
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist-release/StreamPod-setup.exe
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig signatures/StreamPod-setup.exe.sig
          npx tauri signer sign dist-release/StreamPod.exe
          mv dist-release/StreamPod.exe.sig signatures/
          # Nouveautés : section « ### X.Y.Z » du README (sans suffixe -rc), reprise
          # par le bandeau de mise à jour et par les notes de release.
          awk -v v="### ${v%%-*}" '$0==v{f=1;next} /^##/{f=0} f' README.md > notes-maj.md
          node -e '
            const fs = require("fs");
            const [v, base] = process.argv.slice(1);
            const sig = (f) => fs.readFileSync("signatures/" + f + ".sig", "utf8").trim();
            fs.writeFileSync("dist-release/latest.json", JSON.stringify({
              version: v,
              notes: fs.readFileSync("notes-maj.md", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": { url: base + "/StreamPod-setup.exe", signature: sig("StreamPod-setup.exe") },
                "windows-x86_64-portable": { url: base + "/StreamPod.exe", signature: sig("StreamPod.exe") },
              },
            }, null, 2));
          ' "$v" "$base"
          {
            echo "## Télécharger"
            echo
            echo "- **[StreamPod-setup.exe]($base/StreamPod-setup.exe)** - installateur (recommandé)"
            echo "- **[StreamPod.exe]($base/StreamPod.exe)** - version portable, pour une clé USB ou sans installation"
            echo
            echo "## Nouveautés"
            cat notes-maj.md
            echo
            echo "**Réseau** : la recherche de mises à jour est la seule requête de StreamPod, vers GitHub, sans aucune donnée envoyée. Aucune télémétrie."
            echo
            echo "## Vérification"
            echo
            echo "SHA-256 :"
            echo '```'
            (cd dist-release && sha256sum StreamPod-setup.exe StreamPod.exe | sed 's/ \*/  /')
            echo '```'
            echo
            echo "Exécutable non signé : si Windows SmartScreen s'affiche, choisissez"
            echo "« Informations complémentaires → Exécuter quand même »."
          } > notes.md

      - name: Brouillon de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-release/* --draft --title "StreamPod $GITHUB_REF_NAME" --notes-file notes.md
