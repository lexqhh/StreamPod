name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Version du tag identique aux 3 fichiers
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$v\"" package.json
          grep -q "\"version\": \"$v\"" src-tauri/tauri.conf.json
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Compilation
        run: |
          npm ci
          npm run tauri build

      - name: Binaires et empreintes SHA-256
        run: |
          mkdir dist-release
          cp src-tauri/target/release/streampod.exe dist-release/StreamPod.exe
          cp src-tauri/target/release/bundle/msi/*.msi dist-release/
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          {
            echo "## Vérification"
            echo "SHA-256 :"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "Exécutable non signé : si Windows SmartScreen s'affiche, choisissez"
            echo "« Informations complémentaires → Exécuter quand même »."
          } > ../notes.md

      - name: Brouillon de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-release/* --draft --title "StreamPod $GITHUB_REF_NAME" --notes-file notes.md
