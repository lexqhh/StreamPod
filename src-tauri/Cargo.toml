[package]
name = "streampod"
version = "0.1.2"
description = "Sauvegarde et restauration complète d'OBS Studio"
authors = ["Axel"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "streampod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
dirs = "6"
chrono = { version = "0.4", features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_DirectShow", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Diagnostics_ToolHelp"] }

# Uniquement pour la détection des processus hors Windows : sur Windows, elle
# passe par l'API ToolHelp de la crate `windows` (voir obs::process_actif).
[target.'cfg(not(windows))'.dependencies]
sysinfo = "0.33"

[dev-dependencies]
tempfile = "3"
